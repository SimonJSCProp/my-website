[build]
  publish = "."

# Security + performance headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Redirect bare domain to www (or vice versa — Netlify handles this automatically)
# Contact form thank-you alias
[[redirects]]
  from = "/thank-you"
  to = "/contact.html?submitted=1"
  status = 301

# Retired rate-cut-era-over-2026-hikes, superseded. 301 keeps the ranking signal with the replacement.
[[redirects]]
  from = "/blog/rate-cut-era-over-2026-hikes"
  to = "/blog/rba-cash-rate-september-2026"
  status = 301

# Retired us-iran-war-property-prices, superseded. 301 keeps the ranking signal with the replacement.
[[redirects]]
  from = "/blog/us-iran-war-property-prices"
  to = "/blog/iran-war-inflation-australian-property"
  status = 301

# Retired negative-gearing-changes-investor, superseded. 301 keeps the ranking signal with the replacement.
[[redirects]]
  from = "/blog/negative-gearing-changes-investor"
  to = "/blog/negative-gearing-cgt-changes-2027"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
